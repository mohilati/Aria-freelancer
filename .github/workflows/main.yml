name: Aria Freelancer

on:
  workflow_dispatch:
  push:
    paths:
      - "jobs/*.json"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process client jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free

          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_MODEL: gpt-oss-120b

          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          KREA_API_KEY: ${{ secrets.KREA_API_KEY }}
          KIEAI_API_KEY: ${{ secrets.KIEAI_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

          HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
          HF_IMAGE_PROVIDER: fal-ai
          HF_VIDEO_MODEL: Wan-AI/Wan2.2-TI2V-5B
          HF_VIDEO_PROVIDER: replicate
          HF_TTS_MODEL: hexgrad/Kokoro-82M
          HF_TTS_PROVIDER: replicate
          HF_TTS_VOICE: af_nicole

          SUNO_API_BASE_URL: https://api.sunoapi.org

          ARIA_IMAGE_CHAIN: krea_image,pollinations_image,huggingface_image,fal_image,replicate_image
          ARIA_VIDEO_CHAIN: krea_video,huggingface_video,fal_video,replicate_video
          ARIA_TTS_CHAIN: persian_edge_tts,elevenlabs_tts,huggingface_tts
          ARIA_MUSIC_CHAIN: suno_music,kie_music,pollinations_audio,fal_music

          ARIA_VISUAL_QA: "1"
          ARIA_VISUAL_QA_MIN_SCORE: "70"
          ARIA_OUTPUT_DIR: outputs
          ARIA_PROVIDER_STATE: outputs/.aria_provider_usage.json

        run: python agent.py

      - name: Save completed jobs and media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs outputs

          if ! git diff --cached --quiet; then
            git commit -m "fix: harden clinic media pipeline"
            git push
          fi
