name: Aria Media Test

on:
  workflow_dispatch:
  push:
    paths:
      - "jobs/media-test.json"

permissions:
  contents: write

jobs:
  media-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run media test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VIDEO_MODEL: Wan-AI/Wan2.2-TI2V-5B
          HF_VIDEO_PROVIDER: replicate
          HF_TTS_MODEL: hexgrad/Kokoro-82M
          HF_TTS_PROVIDER: replicate
          HF_MUSIC_MODEL: m-a-p/YuE-s1-7B-anneal-en-cot
          HF_MUSIC_PROVIDER: fal-ai

          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

        run: python agent.py

      - name: Save media test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs outputs

          if ! git diff --cached --quiet; then
            git commit -m "test: run media providers"
            git push
          fi
