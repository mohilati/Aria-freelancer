name: Aria Media Stack Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-media.txt

      - name: Run media test
        env:
          ARIA_OUTPUT_DIR: outputs/media-test

          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
          HUGGINGFACEHUB_API_TOKEN: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}

          HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
          HF_IMAGE_PROVIDER: fal-ai

          HF_VIDEO_MODEL: Wan-AI/Wan2.1-T2V-1.3B
          HF_VIDEO_PROVIDER: fal-ai

          HF_TTS_MODEL: espnet/kan-bayashi_ljspeech_vits
          HF_MUSIC_MODEL: facebook/musicgen-small

          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_IMAGE_MODEL: ${{ vars.REPLICATE_IMAGE_MODEL }}
          REPLICATE_VIDEO_MODEL: ${{ vars.REPLICATE_VIDEO_MODEL }}

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LYRIA_MODEL: lyria-3.5

        run: python test_media_stack.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-media-test-v2
          path: outputs/media-test/
          if-no-files-found: ignore
